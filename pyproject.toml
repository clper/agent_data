[project]
name = "mysql-agent-v2"
version = "0.1.0"
description = "企业级 MySQL 数据问答 Agent：七层信任链 + Schema RAG + AST 安全 + 行列权限"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "sqlglot>=25.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "jieba>=0.42",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
eval = ["pytest>=8.0", "httpx>=0.27"]
vector = ["sentence-transformers>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
